<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving Around Growing Up - Interview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }
        
        .header {
            margin-bottom: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            color: #1a1a1a;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }
        
        form {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .form-section {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        label {
            font-weight: 500;
            font-size: 15px;
            color: #1a1a1a;
        }
        
        .required::after {
            content: " *";
            color: #e74c3c;
        }
        
        input[type="text"],
        input[type="number"],
        select,
        textarea {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        
        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }
        
        .radio-group,
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .radio-option,
        .checkbox-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        input[type="radio"],
        input[type="checkbox"] {
            cursor: pointer;
        }
        
        .radio-option label,
        .checkbox-option label {
            cursor: pointer;
            margin: 0;
            font-weight: normal;
        }
        
        .scale-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        
        .scale-label {
            font-size: 12px;
            color: #666;
            flex: 0 0 auto;
        }
        
        .scale-inputs {
            display: flex;
            gap: 8px;
            flex: 1;
            justify-content: space-between;
        }
        
        .scale-inputs input {
            width: 40px;
            text-align: center;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #667eea;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }
        
        .form-group:first-child .section-title {
            margin-top: 0;
            padding-top: 0;
            border-top: none;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .reset-btn {
            background: #f0f0f0;
            color: #333;
        }
        
        .reset-btn:hover {
            background: #e0e0e0;
        }
        
        .info-text {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        
        .success-message {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Moving Around Growing Up</h1>
            <p>Personal reflections on a childhood of moving between countries.<br>~15 minutes to complete</p>
        </div>
        
        <form action="https://hooks.zapier.com/hooks/catch/28521906/46nfroo/" method="POST" id="interviewForm">
            <!-- PERSONAL INFO SECTION -->
            <div class="form-group">
                <label for="name" class="required">Your name (or preferred name)</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="age" class="required">Age</label>
                <input type="number" id="age" name="age" min="18" required>
            </div>
            
            <div class="form-group">
                <label for="nationality" class="required">Nationality or nationalities</label>
                <input type="text" id="nationality" name="nationality" required>
            </div>
            
            <!-- QUANTITATIVE SECTION -->
            <div class="section-title">Background & Experience</div>
            
            <div class="form-group">
                <label class="required">How many countries did you live in by age 19?</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="countries1" name="countries" value="2-3" required>
                        <label for="countries1">2-3</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="countries2" name="countries" value="4-5">
                        <label for="countries2">4-5</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="countries3" name="countries" value="6-7">
                        <label for="countries3">6-7</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="countries4" name="countries" value="8+">
                        <label for="countries4">8+</label>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label class="required">How many times did you change schools?</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="schools1" name="schools" value="2-3" required>
                        <label for="schools1">2-3</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="schools2" name="schools" value="4-5">
                        <label for="schools2">4-5</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="schools3" name="schools" value="6-8">
                        <label for="schools3">6-8</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="schools4" name="schools" value="9+">
                        <label for="schools4">9+</label>
                    </div>
                </div>
            </div>
            

            
            <!-- INTERVIEW QUESTIONS SECTION -->
            <div class="section-title">Your Story</div>
            
            <div class="form-group">
                <label for="q1">Where did you live growing up, and how many different countries did you move between by the time you were 19?</label>
                <textarea id="q1" name="q1"></textarea>
            </div>
            
            <div class="form-group">
                <label for="q2">What was the biggest difference between your childhood and what you think growing up in one place would have been like?</label>
                <textarea id="q2" name="q2"></textarea>
            </div>
            
            <div class="form-group">
                <label for="q3">What's something you gained from moving around so much that you think most people don't have?</label>
                <textarea id="q3" name="q3"></textarea>
            </div>
            
            <div class="form-group">
                <label for="q4">Were there any skills or ways of thinking you picked up early that came in handy later?</label>
                <textarea id="q4" name="q4"></textarea>
            </div>
            
            <div class="form-group">
                <label for="q5">Do you still have friendships from your moving-around years? How did you keep them going?</label>
                <textarea id="q5" name="q5"></textarea>
            </div>
            
            <div class="form-group">
                <label for="q5b">Did you ever experience language barriers when moving to new countries? How did you handle them?</label>
                <textarea id="q5b" name="q5b"></textarea>
            </div>
            
            <div class="form-group">
                <label for="q6">When did it first hit you that moving around meant losing things? What specifically were you losing (friendships, sense of home, family time, familiar places, etc.) and what was that moment like?</label>
                <textarea id="q6" name="q6"></textarea>
            </div>
            
            <div class="form-group">
                <label for="q7">How did all the moving affect your sense of home or belonging?</label>
                <textarea id="q7" name="q7"></textarea>
            </div>
            
            <div class="form-group">
                <label for="q8">Did your relationship with your parents change because of how much you moved? In what way?</label>
                <textarea id="q8" name="q8"></textarea>
            </div>
            
            <div class="form-group">
                <label for="q9">How do you answer "where are you from?" Does it still feel like an awkward question?</label>
                <textarea id="q9" name="q9"></textarea>
            </div>
            
            <div class="form-group">
                <label for="q10">Do you feel different from people who grew up in one place? If so, how?</label>
                <textarea id="q10" name="q10"></textarea>
            </div>
            
            <div class="form-group">
                <label for="q11">Looking back now, what parts of your childhood do you feel grateful for, and what parts are you still figuring out?</label>
                <textarea id="q11" name="q11"></textarea>
            </div>
            
            <div class="form-group">
                <label for="q12">If you have kids (or think about having them), would you want them to have a similar experience? Why or why not?</label>
                <textarea id="q12" name="q12"></textarea>
            </div>
            
            <div class="form-group">
                <label for="q13">What do you wish the adults around you had understood about what you were going through back then?</label>
                <textarea id="q13" name="q13"></textarea>
            </div>
            
            <div class="form-group">
                <label for="q14">If you could give yourself advice at 16, knowing what you know now, what would you say about all the moving around?</label>
                <textarea id="q14" name="q14"></textarea>
            </div>
            
            <div class="section-title">Final Reflection</div>
            
            <div class="form-group">
                <label class="required">If you had to rate it, how would you say moving around impacted you overall as a kid?</label>
                <div class="scale-container">
                    <span class="scale-label">Very negative</span>
                    <div class="scale-inputs">
                        <input type="radio" name="impact" value="1" id="impact1" required>
                        <input type="radio" name="impact" value="2" id="impact2">
                        <input type="radio" name="impact" value="3" id="impact3">
                        <input type="radio" name="impact" value="4" id="impact4">
                        <input type="radio" name="impact" value="5" id="impact5">
                        <input type="radio" name="impact" value="6" id="impact6">
                        <input type="radio" name="impact" value="7" id="impact7">
                        <input type="radio" name="impact" value="8" id="impact8">
                        <input type="radio" name="impact" value="9" id="impact9">
                        <input type="radio" name="impact" value="10" id="impact10">
                    </div>
                    <span class="scale-label">Very positive</span>
                </div>
            </div>
            
            <div class="button-group">
                <button type="submit" class="submit-btn">Submit</button>
                <button type="reset" class="reset-btn">Clear</button>
            </div>
            
            <div class="success-message" id="successMessage">
                Thanks for completing the interview! Your response has been submitted.
            </div>
        </form>
    </div>
    
    <script>
                document.getElementById('interviewForm').addEventListener('submit', function(e) {
                                e.preventDefault();

                                var form = e.target;
                                var submitBtn = form.querySelector('.submit-btn');
                                submitBtn.disabled = true;
                                submitBtn.textContent = 'Submitting...';

                                var formData = new FormData(form);

                                fetch(form.action, {
                                                    method: 'POST',
                                                    mode: 'no-cors',
                                                    body: formData
                                })
                                .then(function() {
                                                    var msg = document.getElementById('successMessage');
                                    form.parentNode.insertBefore(msg, form);
                                    form.style.display = 'none';
                                    msg.style.display = 'block';
                                    window.scrollTo(0, 0);
                                })
                                .catch(function() {
                                                    submitBtn.disabled = false;
                                                    submitBtn.textContent = 'Submit';
                                                    alert('Something went wrong submitting your response. Please try again, or let Simon know if it keeps happening.');
                                });
                });
    </script>
</body>
</html>
